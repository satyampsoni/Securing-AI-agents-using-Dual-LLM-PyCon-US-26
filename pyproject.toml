[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dual-llm-agent-security"
version = "0.2.0"
description = "CLI-first dual-LLM security proof-of-concept that emits traces for dual-llm-bench."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
]

[project.scripts]
dual-llm-security = "dual_llm_security.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dual_llm_security"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/datasets",
  "/examples",
  "/tests",
  "/docker",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
